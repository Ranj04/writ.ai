name: writ.ai authorization check
description: Verify a stored writ.ai grant and fail when execution is not authorized.

inputs:
  agent-url:
    description: Base URL of the running writ.ai agent service.
    required: true
  workspace-id:
    description: Live workspace whose stored authorization should be verified.
    required: true
  grant:
    description: Stored authorization to verify (initial or replacement).
    required: false
    default: initial
  python-version:
    description: Python version used to install the writ.ai CLI.
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install writ.ai CLI
      shell: bash
      run: python -m pip install "${GITHUB_ACTION_PATH}/../../.."

    - name: Verify writ.ai authorization
      shell: bash
      env:
        WRITAI_ACTION_AGENT_URL: ${{ inputs.agent-url }}
        WRITAI_ACTION_WORKSPACE_ID: ${{ inputs.workspace-id }}
        WRITAI_ACTION_GRANT: ${{ inputs.grant }}
      run: >-
        writai
        --agent-url "$WRITAI_ACTION_AGENT_URL"
        workspace verify "$WRITAI_ACTION_WORKSPACE_ID"
        --grant "$WRITAI_ACTION_GRANT"
