# Grouped and monthly on purpose. Ungrouped weekly updates across 29 transitive
# @radix-ui packages produce a wall of pull requests that, left unattended, is a
# worse signal than no Dependabot at all. Security updates are not grouped.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
    ignore:
      # svix 2.x changes webhook payload verification. The <2 ceiling in
      # pyproject.toml is load-bearing: widening it resolves 2.x and fails the
      # seven tests in backend/tests/test_hexclave_webhooks.py, which is how PR #2
      # was caught. Moving to 2.x is real work with those tests updated
      # deliberately, not a range bump, so the major is excluded here rather than
      # re-proposed every month.
      # `update-types: semver-major` does NOT match this: Dependabot is widening a
      # range ceiling in pyproject.toml, not bumping a pinned version, and it kept
      # proposing the change after a `recreate` with that rule in place. A version
      # constraint is what actually excludes 2.x.
      - dependency-name: svix
        versions: [">=2"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
