[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "writai"
version = "0.1.0"
description = "Continuous decision-provenance control for autonomous coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  # <2: svix 2.x changes webhook verification and fails backend/tests/test_hexclave_webhooks.py
  "svix>=1.70,<2",
]

[project.optional-dependencies]
graph = ["neo4j>=5.20,<7"]
agent = ["langgraph>=0.2,<1"]
llm = ["anthropic>=0.40,<1"]
composio = ["composio>=0.18.0,<1"]
full = ["neo4j>=5.20,<7", "langgraph>=0.2,<1", "anthropic>=0.40,<1"]
dev = [
  "pytest>=8.2,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
  "types-PyYAML>=6.0,<7",
  "pytest-cov>=5.0,<8",
]

[project.scripts]
writai = "writai.cli:main"
writai-demo = "writai.demo:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --cov=writai --cov-report=term-missing:skip-covered --cov-report=json"
markers = [
  "neo4j: opt-in integration tests that reset a disposable Neo4j database",
]

[tool.coverage.run]
source = ["writai"]
branch = false
omit = ["*/tests/*"]

[tool.coverage.report]
# One point below the 84.9% measured when this gate was introduced; scripts/ci/coverage_floors.py
# holds the per-module floors. Lower either only with an entry in outputs/OPEN-ITEMS-REGISTER.md.
fail_under = 83
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["anthropic", "composio", "langgraph.*", "neo4j", "neo4j.*"]
ignore_missing_imports = true
